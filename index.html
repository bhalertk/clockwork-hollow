<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蒸汽機械城｜新手教學</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">STEAM CITY · PROLOGUE</p><h1>蒸汽機械城</h1><p>十年前，大樓倒塌，機器人僥倖生還並離開。如今，他回到了這片廢墟。</p></div><div class="header-actions"><button id="equipment-button" class="badge" type="button">工具裝備</button><button id="help-button" class="badge" type="button">操作說明</button><button id="pause-button" class="badge" type="button">暫停</button><button id="fullscreen-button" class="badge" type="button">全螢幕</button><button id="restart-button" class="badge" type="button">重新開始</button><button id="shake-toggle" class="badge" type="button" aria-pressed="true">震動：開啟</button><button id="sound-toggle" class="badge" type="button" aria-pressed="true">聲音：開啟</button></div></header>
    <canvas id="game" width="960" height="540" aria-label="蒸汽機械城遊戲畫面"></canvas>
    <div class="touch-controls" aria-label="觸控操作">
      <div class="touch-group"><button type="button" data-key="KeyA" aria-label="向左移動">◀</button><button type="button" data-key="KeyD" aria-label="向右移動">▶</button><button type="button" data-key="KeyS" aria-label="向下瞄準">↓</button><button type="button" data-key="KeyW" aria-label="跳躍或向上瞄準">↑</button></div>
      <div class="touch-group"><button type="button" data-key="Space">跳躍</button><button type="button" data-action="attack">攻擊</button><button type="button" data-key="ShiftLeft">衝刺</button><button type="button" data-key="KeyE">互動</button><button type="button" data-key="KeyQ">修復</button><button type="button" data-key="KeyT">重試跑酷</button><button type="button" data-key="KeyG">休息站傳送</button><button type="button" data-key="Tab">地圖</button><button type="button" data-key="KeyJ">紀錄</button><button type="button" data-key="KeyI">裝備</button><button type="button" data-key="KeyF">工具</button><button type="button" data-key="Digit1">選項 1</button><button type="button" data-key="Digit2">選項 2</button><button type="button" data-key="Digit3">選項 3</button><button type="button" data-key="Digit4">選項 4</button><button type="button" data-key="Digit5">選項 5</button><button type="button" data-key="Digit6">選項 6</button><button type="button" data-key="Escape">關閉／暫停</button></div>
    </div>
    <div class="instructions"><span><kbd>A</kbd> <kbd>D</kbd> 或 <kbd>←</kbd> <kbd>→</kbd> 移動</span><span><kbd>W</kbd>、<kbd>↑</kbd> 或 <kbd>空白鍵</kbd> 跳躍／貼牆蹬牆跳</span><span><kbd>Shift</kbd> 蒸汽衝刺</span><span><kbd>E</kbd> 互動／休息</span><span><kbd>Tab</kbd> 地圖</span><span><kbd>J</kbd> 紀錄冊</span><span><kbd>I</kbd> 休息站更換裝備</span><span><kbd>G</kbd> 休息站傳送</span><span><kbd>F</kbd> 使用攻擊工具</span><span><kbd>T</kbd> 重試跑酷</span><span><kbd>Esc</kbd> 暫停</span><span><kbd>M</kbd> 音效</span><span><kbd>H</kbd> 操作說明</span><span><kbd>Q</kbd> 蓄力蒸汽修復</span><span><kbd>滑鼠左鍵</kbd> 揮動齒輪劍</span><span>空中按住 <kbd>W</kbd>／<kbd>↑</kbd> 或 <kbd>S</kbd>／<kbd>↓</kbd> 加滑鼠左鍵：上劈／下劈</span><span>完成或倒下後按 <kbd>R</kbd> 重新出發</span></div>
    <p class="note">廢棄溫室右側可進入空中跑酷；在已啟動的休息站附近按 G 傳送、按 I 更換裝備。</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
