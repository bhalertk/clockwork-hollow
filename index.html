<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蒸汽機械城｜探索試玩版</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">STEAM CITY · EXPLORATION DEMO</p><h1>蒸汽機械城</h1><p>探索機械城，找回失落的動力。</p></div><div class="header-actions"><button id="help-button" class="badge" type="button">操作說明</button><button id="pause-button" class="badge" type="button">暫停</button><button id="fullscreen-button" class="badge" type="button">全螢幕</button><button id="restart-button" class="badge" type="button">重新開始</button><button id="shake-toggle" class="badge" type="button" aria-pressed="true">震動：開啟</button><button id="sound-toggle" class="badge" type="button" aria-pressed="true">聲音：開啟</button></div></header>
    <canvas id="game" width="960" height="540" aria-label="蒸汽機械城遊戲畫面"></canvas>
    <div class="touch-controls" aria-label="觸控操作">
      <div class="touch-group"><button type="button" data-key="KeyA" aria-label="向左移動">◀</button><button type="button" data-key="KeyD" aria-label="向右移動">▶</button><button type="button" data-key="KeyS" aria-label="向下瞄準">↓</button><button type="button" data-key="KeyW" aria-label="跳躍或向上瞄準">↑</button></div>
      <div class="touch-group"><button type="button" data-key="Space">跳躍</button><button type="button" data-action="attack">攻擊</button><button type="button" data-key="ShiftLeft">衝刺</button><button type="button" data-key="KeyE">互動</button><button type="button" data-key="KeyQ">修復</button><button type="button" data-key="Tab">地圖</button><button type="button" data-key="KeyJ">紀錄</button></div>
    </div>
    <div class="instructions"><span><kbd>A</kbd> <kbd>D</kbd> 或 <kbd>←</kbd> <kbd>→</kbd> 移動</span><span><kbd>W</kbd>、<kbd>↑</kbd> 或 <kbd>空白鍵</kbd> 跳躍</span><span><kbd>Shift</kbd> 蒸汽衝刺</span><span><kbd>E</kbd> 互動／休息</span><span><kbd>Tab</kbd> 地圖</span><span><kbd>J</kbd> 紀錄冊</span><span><kbd>Esc</kbd> 暫停</span><span><kbd>M</kbd> 音效</span><span><kbd>H</kbd> 操作說明</span><span><kbd>Q</kbd> 蒸汽修復</span><span><kbd>滑鼠左鍵</kbd> 揮動齒輪劍</span><span>空中按住 <kbd>W</kbd>／<kbd>↑</kbd> 或 <kbd>S</kbd>／<kbd>↓</kbd> 加滑鼠左鍵：上劈／下劈</span><span>完成或倒下後按 <kbd>R</kbd> 重新出發</span></div>
    <p class="note">探索提示：取得動力核心、啟動控制室，再前往升降機井與廢棄溫室。按 H 查看操作說明。</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
